
name: 01 - CWVJ Flask Build Test Publish Pipeline

on:
  push:
    branches:
      - main
      - feature/*
      - demo
    paths:
      - 'app/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

env:
  APPLICATION: cwvj-flask-app
  DOCKER_USERNAME: awybio

jobs:
  flask-build-test-publish-job:
    runs-on: ubuntu-latest

    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'main')) || github.event_name == 'pull_request' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION }}:${{ env.IMAGE_TAG }}

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name flask-container "$DOCKER_USERNAME/$APPLICATION:$IMAGE_TAG"

      - name: Smoke Test Application
        run: |
          sleep 10
          curl --fail http://localhost:5000
          curl --fail http://localhost:5000/health

      - name: Login to DockerHub
        if: ${{ success() && github.event_name == 'push' && github.ref_name == 'main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image To DockerHub
        if: ${{ success() && github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          docker push "$DOCKER_USERNAME/$APPLICATION:$IMAGE_TAG"

      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs flask-container || true

      - name: Cleanup Containers
        if: ${{ always() }}
        run: |
          docker rm -f flask-container || true
